<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotomosaic</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__wrapper">
        <h1 class="heading">Fotomosaic</h1>
        <nav id="basic" class="basic">
          <div class="basic__main-func">
            <input type="file" id="basicInput" multiple />
            <label for="basicInput" id="basicLabel">Выбрать фото</label>
          </div>
          <button type="button" id="basicFill" class="basicBtn">Заполнить</button>
          <button type="button" id="basicRender" class="basicBtn">Рендер</button>
        </nav>
        <select id="selectMode">
          <option value="0" class="mode">Заполнение</option>
          <option value="1" class="mode">Формат</option>
          <option value="2" class="mode">Выдиление</option>
          <option value="3" class="mode">Перемещение</option>
        </select>
      </div>
    </header>
    <main class="main">
      <div class="wrapper">
        <div id="table"></div>
      </div>
    </main>
  </body>
  <script src="/js/index.js"></script>
</html>
