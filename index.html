<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotomosaic</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="wrapper">
        <h1 class="title">Fotomosaic:</h1>
        <form id="mainForm">
          <input type="file" name="photos" id="inputImages" multiple />
          <button type="button" id="fillBtn">fill photos</button>
          <button type="button" id="renderBtn">render/work</button>
          <select id="rowMode">
            <option value="8 6">8 row (102, normal)</option>
            <option value="9 7">9 row (133)</option>
            <option value="10 8">10 row (126)</option>
            <option value="11 9">11 row (138)</option>
            <!-- <option value="30">30x40</option> -->
          </select>
          <button type="button" onclick="location.reload()">reset</button>
        </form>
        <form id="selectForm">
          <input type="file" name="photos" id="changeInput" multiple />
          <button type="button" id="changeBtn">fill photos</button>
          <button type="button" id="deselectBtn">deselect</button>
          <button type="button" id="clearBtn">clear</button>
        </form>
        <span id="counter"></span>
      </div>
    </header>
    <main class="main">
      <div class="wrapper">
        <div id="table"></div>
      </div>
    </main>
  </body>
  <script src="/js/index.js"></script>
</html>
